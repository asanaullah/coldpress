# Generated by: Claude Sonnet 4.5
# Pre-commit hooks for Coldpress
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        exclude: ^(venv/|legacy/)
      # Run the formatter
      - id: ruff-format
        exclude: ^(venv/|legacy/)

  - repo: local
    hooks:
      # Run security tests
      - id: test-security
        name: security tests
        entry: python tests/test_security.py
        language: system
        pass_filenames: false
        always_run: true

      # Run script generation security tests
      - id: test-script-gen-security
        name: script generation security tests
        entry: python tests/test_script_gen_security.py
        language: system
        pass_filenames: false
        always_run: true

      # Run label tests
      - id: test-labels
        name: label tests
        entry: python tests/test_labels.py
        language: system
        pass_filenames: false
        always_run: true

      # Run error handling tests
      - id: test-error-handling
        name: error handling tests
        entry: python tests/test_error_handling.py
        language: system
        pass_filenames: false
        always_run: true
