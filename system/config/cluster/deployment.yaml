# Assisted by: Gemini 3
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coldpress-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coldpress-operator-role
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coldpress.io"]
    resources: ["compute-jobs", "discovery-jobs", "workload-templates", "discovery-templates", "coldpressresourceallocators"]
    verbs: ["*"]
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings"]
    verbs: ["*"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "persistentvolumeclaims", "nodes", "events", "services", "namespaces"]
    verbs: ["*"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "localqueues"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coldpress-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coldpress-operator-role
subjects:
  - kind: ServiceAccount
    name: coldpress-operator
    namespace: coldpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coldpress-operator
  namespace: coldpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coldpress-operator
  template:
    metadata:
      labels:
        app: coldpress-operator
    spec:
      serviceAccountName: coldpress-operator
      containers:
        - name: operator
          image: quay.io/asanaullah/coldpress-base-image:latest
          imagePullPolicy: Always
          command: ["kopf", "run", "/app/operator.py", "--verbose"]
          env:
            - name: COLDPRESS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
