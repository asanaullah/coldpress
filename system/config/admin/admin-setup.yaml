# Assisted by: Gemini 3
apiVersion: v1
kind: Namespace
metadata:
  name: coldpress-admin
  labels:
    kueue.openshift.io/managed: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coldpress-admin-privileged-binding
  namespace: coldpress-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: default
    namespace: coldpress-admin
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: coldpress-admin
  name: local-queue-coldpress-admin
spec:
  clusterQueue: cluster-queue-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coldpress-admin-storage
  namespace: coldpress-admin
spec:
  storageClassName: nfs-csi
  accessModes: [ "ReadWriteMany" ]
  resources: 
    requests: 
      storage: 50Gi 
---
apiVersion: v1
kind: Pod
metadata:
  name: coldpress-admin-data-explorer
  namespace: coldpress-admin
spec:
  restartPolicy: Never
  containers:
    - name: explorer
      image: alpine
      command: ["sleep", "infinity"]
      volumeMounts:
        - mountPath: "/data"
          name: admin-vol
  volumes:
    - name: admin-vol
      persistentVolumeClaim:
        claimName: coldpress-admin-storage
