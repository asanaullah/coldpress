[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldpress"
version = "0.2.1"
description = "AI/HPC workload orchestration for Kubernetes/OpenShift"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "See LICENSE file"}
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
coldpress = "coldpress.cli:cli"
coldpress-setup = "coldpress_setup.cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["coldpress", "coldpress_setup", "coldpress_common"]
