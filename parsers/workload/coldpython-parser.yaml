# Assisted by: Gemini 3
apiVersion: coldpress.io/v1
kind: WorkloadTemplate
metadata:
  name: coldpython-parser
  namespace: coldpress-admin
spec:
  image: "pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime"
  env:
    - name: "HOME"
      value: "/tmp"
  command: ["bash", "-c"]
  args:
    - |
      set -e
      mkdir -p /tmp/result
      cd /tmp/result
      
      # 1. Decode and install from requirements.txt if provided
      if [ -n "{reqs_b64}" ] && [ "{reqs_b64}" != '""' ]; then
        echo "Decoding requirements.txt..."
        echo "{reqs_b64}" | base64 -d > requirements.txt
        pip install -q -r requirements.txt
      fi
      
      # 2. Install inline pip packages if provided
      if [ -n "{pip_packages}" ] && [ "{pip_packages}" != '""' ]; then
        echo "Installing inline pip packages: {pip_packages}"
        pip install -q {pip_packages}
      fi
      
      echo "Decoding script..."
      echo "{script_b64}" | base64 -d > app.py
      
      echo "Executing python script..."
      PYTHONUNBUFFERED=1 python3 app.py
      
  blocking:
    type: "completion"
  resources:
    limits:
      nvidia.com/gpu: "{num_gpus}"
  tolerate_all: true
  ephemeral_mounts:
    - target: "/tmp/result"
      size: "2000Mi"
  sys_mounts: []
  files_to_copy: []
