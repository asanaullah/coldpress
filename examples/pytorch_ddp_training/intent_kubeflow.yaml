project: coldpress-project
output: ddp-training-job
target: kubeflow

files:
  - train.py

discovery:
  template: user_snapshot
  tasks: all

tasks:
  - name: ddp-training
    replicas: 2
    args:
      nnodes: "${REPLICAS}"
      # Kubeflow PyTorchJob auto-injects:
      # - MASTER_ADDR
      # - MASTER_PORT
      # - RANK (via RANK env var)
      # So we don't need to specify them here
