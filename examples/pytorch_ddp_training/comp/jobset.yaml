        template:
          metadata:
            labels:
              app: mkdir
          spec:
            restartPolicy: Never
            containers:
            - name: mkdir
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              command:
              - sh
              - -c
              args:
              - mkdir -p /data/coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821
                /data/coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821/task-0
                /data/coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821/task-1
                && echo Created directory /data/coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821
                with 2 task subdirectories
              volumeMounts:
              - name: storage
                mountPath: /data
            volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: coldpress-project-storage
  - name: task-0
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              app: task-0
              coldpress/gid: coldpress-ddp-training
          spec:
            restartPolicy: Never
            containers:
            - name: training
              image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
              workingDir: /workspace
              command:
              - bash
              - -c
              args:
              - '# Build torch.distributed.run command from env vars

                CMD="python -m torch.distributed.run"


