                CMD="$CMD train.py"

                CMD="$CMD --dataset=mnist"

                CMD="$CMD --train-test-split=0.8"

                CMD="$CMD --epochs=50"

                CMD="$CMD --batch-size=128"

                CMD="$CMD --hidden-size=4096"

                CMD="$CMD --lr=0.01"

