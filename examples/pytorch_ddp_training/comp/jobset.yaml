            - name: discovery
              image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
              command:
              - /bin/bash
              - -c
              args:
              - "echo \"User System Snapshot - Capturing performance baseline with\
                \ dynamic benchmarks...\"\n\n# Create comprehensive Python script\
                \ in /tmp\ncat << 'EOF_SNAPSHOT' > /tmp/generate_snapshot.py\nimport\
                \ subprocess\nimport json\nimport time\nimport os\nfrom datetime import\
                \ datetime\n\ndef run_cmd(command):\n    try:\n        out = subprocess.run(command,\
                \ shell=True, capture_output=True, text=True, timeout=10)\n      \
                \  return out.stdout.strip() if out.returncode == 0 else \"Not available\"\
                \n    except Exception as e:\n        return \"Not available\"\n\n\
                def cpu_benchmark():\n    \"\"\"Simple CPU compute benchmark - measures\
                \ MFLOPS\"\"\"\n    start = time.time()\n    result = 0.0\n    iterations\
                \ = 10000000\n    for i in range(iterations):\n        result += i\
                \ * 1.5 - 0.7\n    elapsed = time.time() - start\n    mflops = (iterations\
                \ * 2) / (elapsed * 1000000)  # 2 ops per iteration\n    return {\n\
                \        \"iterations\": iterations,\n        \"time_seconds\": f\"\
                {elapsed:.4f}\",\n        \"mflops\": f\"{mflops:.2f}\"\n    }\n\n\
                def memory_bandwidth_benchmark():\n    \"\"\"Memory sequential read/write\
                \ benchmark\"\"\"\n    size_mb = 100\n    size_bytes = size_mb * 1024\
                \ * 1024\n    data = bytearray(size_bytes)\n\n    # Write test\n \
                \   start = time.time()\n    for i in range(0, size_bytes, 8):\n \
                \       data[i:i+8] = b'\\x00\\x01\\x02\\x03\\x04\\x05\\x06\\x07'\n\
                \    write_time = time.time() - start\n    write_bw = (size_mb / write_time)\
                \ if write_time > 0 else 0\n\n    # Read test\n    start = time.time()\n\
                \    checksum = 0\n    for i in range(0, size_bytes, 8):\n       \
                \ checksum += data[i]\n    read_time = time.time() - start\n    read_bw\
                \ = (size_mb / read_time) if read_time > 0 else 0\n\n    return {\n\
                \        \"test_size_mb\": size_mb,\n        \"write_bandwidth_mbps\"\
                : f\"{write_bw:.2f}\",\n        \"read_bandwidth_mbps\": f\"{read_bw:.2f}\"\
                ,\n        \"write_time_sec\": f\"{write_time:.4f}\",\n        \"\
                read_time_sec\": f\"{read_time:.4f}\"\n    }\n\ndef disk_io_benchmark():\n\
                \    \"\"\"Disk I/O benchmark using /tmp\"\"\"\n    test_file = \"\
                /tmp/io_bench_test.dat\"\n    size_mb = 50\n    block_size = 1024\
                \ * 1024  # 1MB blocks\n\n    try:\n        # Write test\n       \
                \ start = time.time()\n        with open(test_file, 'wb') as f:\n\
                \            for _ in range(size_mb):\n                f.write(os.urandom(block_size))\n\
                \            f.flush()\n            os.fsync(f.fileno())\n       \
                \ write_time = time.time() - start\n        write_bw = (size_mb /\
                \ write_time) if write_time > 0 else 0\n\n        # Read test\n  \
                \      start = time.time()\n        with open(test_file, 'rb') as\
                \ f:\n            while f.read(block_size):\n                pass\n\
                \        read_time = time.time() - start\n        read_bw = (size_mb\
                \ / read_time) if read_time > 0 else 0\n\n        # Cleanup\n    \
                \    os.remove(test_file)\n\n        return {\n            \"test_size_mb\"\
                : size_mb,\n            \"write_bandwidth_mbps\": f\"{write_bw:.2f}\"\
                ,\n            \"read_bandwidth_mbps\": f\"{read_bw:.2f}\",\n    \
                \        \"write_time_sec\": f\"{write_time:.4f}\",\n            \"\
                read_time_sec\": f\"{read_time:.4f}\"\n        }\n    except Exception\
                \ as e:\n        return {\"error\": str(e)}\n\ndef context_switch_benchmark():\n\
                \    \"\"\"Measure context switch overhead using subprocess spawning\"\
                \"\"\n    iterations = 100\n    start = time.time()\n    for _ in\
                \ range(iterations):\n        subprocess.run(['true'], capture_output=True)\n\
                \    elapsed = time.time() - start\n    avg_per_switch = (elapsed\
                \ / iterations) * 1000  # milliseconds\n\n    return {\n        \"\
                iterations\": iterations,\n        \"total_time_sec\": f\"{elapsed:.4f}\"\
                ,\n        \"avg_per_spawn_ms\": f\"{avg_per_switch:.4f}\"\n    }\n\
                \nprint(\"Collecting static system information...\")\n\nsnapshot =\
                \ {\n    \"timestamp\": datetime.now().isoformat(),\n    \"system\"\
                : {\n        \"cpu_model\": run_cmd(\"grep 'model name' /proc/cpuinfo\
                \ | head -1 | cut -d: -f2 | xargs\"),\n        \"cpu_count\": run_cmd(\"\
                grep -c ^processor /proc/cpuinfo\"),\n        \"cpu_cores_per_socket\"\
                : run_cmd(\"lscpu | grep 'Core(s) per socket' | awk '{print $NF}'\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"cpu_threads_per_core\"\
                : run_cmd(\"lscpu | grep 'Thread(s) per core' | awk '{print $NF}'\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"cpu_architecture\": run_cmd(\"\
                uname -m\"),\n        \"cpu_current_freq_mhz\": run_cmd(\"cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq\
                \ 2>/dev/null | awk '{print $1/1000}' || echo 'N/A'\"),\n        \"\
                cpu_max_freq_mhz\": run_cmd(\"cat /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq\
                \ 2>/dev/null | awk '{print $1/1000}' || echo 'N/A'\"),\n        \"\
                cpu_min_freq_mhz\": run_cmd(\"cat /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_min_freq\
                \ 2>/dev/null | awk '{print $1/1000}' || echo 'N/A'\"),\n        \"\
                cache_l1d\": run_cmd(\"lscpu | grep 'L1d cache' | awk '{print $NF}'\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"cache_l1i\": run_cmd(\"\
                lscpu | grep 'L1i cache' | awk '{print $NF}' 2>/dev/null || echo 'N/A'\"\
                ),\n        \"cache_l2\": run_cmd(\"lscpu | grep 'L2 cache' | awk\
                \ '{print $NF}' 2>/dev/null || echo 'N/A'\"),\n        \"cache_l3\"\
                : run_cmd(\"lscpu | grep 'L3 cache' | awk '{print $NF}' 2>/dev/null\
                \ || echo 'N/A'\"),\n        \"memory_total_gb\": run_cmd(\"grep MemTotal\
                \ /proc/meminfo | awk '{printf \\\"%.2f\\\", $2/1024/1024}'\"),\n\
                \        \"memory_available_gb\": run_cmd(\"grep MemAvailable /proc/meminfo\
                \ | awk '{printf \\\"%.2f\\\", $2/1024/1024}'\"),\n        \"memory_free_gb\"\
                : run_cmd(\"grep MemFree /proc/meminfo | awk '{printf \\\"%.2f\\\"\
                , $2/1024/1024}'\"),\n        \"numa_node_count\": run_cmd(\"ls -d\
                \ /sys/devices/system/node/node* 2>/dev/null | wc -l\"),\n       \
                \ \"kernel_version\": run_cmd(\"uname -r\"),\n        \"uptime_seconds\"\
                : run_cmd(\"cat /proc/uptime | awk '{print $1}'\")\n    },\n    \"\
                gpu\": {\n        \"gpu_count\": run_cmd(\"nvidia-smi --query-gpu=name\
                \ --format=csv,noheader 2>/dev/null | wc -l\"),\n        \"gpu_models\"\
                : run_cmd(\"nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null\"\
                ),\n        \"gpu_memory_per_device_mb\": run_cmd(\"nvidia-smi --query-gpu=memory.total\
                \ --format=csv,noheader,nounits 2>/dev/null\"),\n        \"gpu_driver_version\"\
                : run_cmd(\"nvidia-smi --query-gpu=driver_version --format=csv,noheader\
                \ 2>/dev/null | head -1\"),\n        \"cuda_version\": run_cmd(\"\
                nvidia-smi | grep 'CUDA Version' | awk '{print $9}' 2>/dev/null ||\
                \ echo 'N/A'\")\n    },\n    \"network\": {\n        \"interface_names\"\
                : run_cmd(\"ls /sys/class/net 2>/dev/null | grep -v lo | tr '\\\\\
                n' ', ' | sed 's/,$//'\"),\n        \"rdma_devices\": run_cmd(\"ls\
                \ /sys/class/infiniband 2>/dev/null | tr '\\\\n' ', ' | sed 's/,$//'\
                \ || echo 'None'\"),\n        \"rdma_device_count\": run_cmd(\"ls\
                \ /sys/class/infiniband 2>/dev/null | wc -l\"),\n        \"primary_mtu\"\
                : run_cmd(\"cat /sys/class/net/eth0/mtu 2>/dev/null || echo 'N/A'\"\
                ),\n        \"tcp_rmem\": run_cmd(\"cat /proc/sys/net/ipv4/tcp_rmem\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"tcp_wmem\": run_cmd(\"\
                cat /proc/sys/net/ipv4/tcp_wmem 2>/dev/null || echo 'N/A'\"),\n  \
                \      \"tcp_congestion_control\": run_cmd(\"cat /proc/sys/net/ipv4/tcp_congestion_control\
                \ 2>/dev/null || echo 'N/A'\")\n    },\n    \"storage\": {\n     \
                \   \"block_devices\": run_cmd(\"lsblk -nd -o NAME,SIZE 2>/dev/null\
                \ | grep -v loop\"),\n        \"nvme_count\": run_cmd(\"ls /dev/nvme*\
                \ 2>/dev/null | grep -c nvme0n || echo '0'\"),\n        \"tmpfs_size\"\
                : run_cmd(\"df -h /tmp 2>/dev/null | tail -1 | awk '{print $2}'\"\
                ),\n        \"tmpfs_avail\": run_cmd(\"df -h /tmp 2>/dev/null | tail\
                \ -1 | awk '{print $4}'\"),\n        \"io_scheduler\": run_cmd(\"\
                cat /sys/block/sda/queue/scheduler 2>/dev/null | grep -o '\\\\[.*\\\
                \\]' | tr -d '[]' || echo 'N/A'\")\n    },\n    \"performance_config\"\
                : {\n        \"cpu_governor\": run_cmd(\"cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"numa_balancing\": run_cmd(\"\
                cat /proc/sys/kernel/numa_balancing 2>/dev/null || echo 'N/A'\"),\n\
                \        \"transparent_hugepages\": run_cmd(\"cat /sys/kernel/mm/transparent_hugepage/enabled\
                \ 2>/dev/null | grep -o '\\\\[.*\\\\]' | tr -d '[]' || echo 'N/A'\"\
                ),\n        \"swappiness\": run_cmd(\"cat /proc/sys/vm/swappiness\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"dirty_ratio\": run_cmd(\"\
                cat /proc/sys/vm/dirty_ratio 2>/dev/null || echo 'N/A'\"),\n     \
                \   \"dirty_background_ratio\": run_cmd(\"cat /proc/sys/vm/dirty_background_ratio\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"max_map_count\": run_cmd(\"\
                cat /proc/sys/vm/max_map_count 2>/dev/null || echo 'N/A'\"),\n   \
                \     \"file_max\": run_cmd(\"cat /proc/sys/fs/file-max 2>/dev/null\
                \ || echo 'N/A'\")\n    },\n    \"process_limits\": {\n        \"\
                max_user_processes\": run_cmd(\"ulimit -u 2>/dev/null || echo 'N/A'\"\
                ),\n        \"max_open_files\": run_cmd(\"ulimit -n 2>/dev/null ||\
                \ echo 'N/A'\"),\n        \"max_stack_size_kb\": run_cmd(\"ulimit\
                \ -s 2>/dev/null || echo 'N/A'\"),\n        \"max_memory_size_kb\"\
                : run_cmd(\"ulimit -m 2>/dev/null || echo 'N/A'\"),\n        \"cgroup_cpu_quota\"\
                : run_cmd(\"cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null ||\
                \ echo 'N/A'\"),\n        \"cgroup_cpu_period\": run_cmd(\"cat /sys/fs/cgroup/cpu/cpu.cfs_period_us\
                \ 2>/dev/null || echo 'N/A'\"),\n        \"cgroup_memory_limit_bytes\"\
                : run_cmd(\"cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null\
                \ || echo 'N/A'\")\n    }\n}\n\n# Dynamic Benchmarks\nprint(\"Running\
                \ CPU compute benchmark...\")\nsnapshot[\"benchmarks\"] = {\n    \"\
                cpu_compute\": cpu_benchmark()\n}\n\nprint(\"Running memory bandwidth\
                \ benchmark...\")\nsnapshot[\"benchmarks\"][\"memory_bandwidth\"]\
                \ = memory_bandwidth_benchmark()\n\nprint(\"Running disk I/O benchmark...\"\
                )\nsnapshot[\"benchmarks\"][\"disk_io\"] = disk_io_benchmark()\n\n\
                print(\"Running context switch benchmark...\")\nsnapshot[\"benchmarks\"\
                ][\"context_switch\"] = context_switch_benchmark()\n\n# Write JSON\n\
                with open(\"/tmp/result/discovery.json\", \"w\") as f:\n    json.dump(snapshot,\
                \ f, indent=2)\n\nprint(\"Snapshot generation complete!\")\nEOF_SNAPSHOT\n\
                \n# Execute snapshot generation\nmkdir -p /tmp/result\npython3 /tmp/generate_snapshot.py\n\
                \n# Clean up intermediate scripts\nrm -f /tmp/generate_snapshot.py\n\
                \necho \"User system snapshot complete. Results in discovery.json\"\
                \n\nif [ -f /tmp/result/discovery.json ]; then mv /tmp/result/discovery.json\
                \ /tmp/result/discovery_user_snapshot.json; fi"
              volumeMounts:
              - name: results
                mountPath: /tmp/result
                subPath: coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821/task-0
    dependsOn:
    - name: mkdir
      status: Complete
