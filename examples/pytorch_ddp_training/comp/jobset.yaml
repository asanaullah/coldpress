                  memory: 16Gi
                  cpu: '8'
                limits:
                  nvidia.com/gpu: '2'
                  memory: 16Gi
              env:
              - name: NCCL_DEBUG
                value: INFO
              - name: NPROC_PER_NODE
                value: '2'
              - name: NNODES
                value: '2'
              - name: MASTER_ADDR
                value: coldpress-ddp-training-task-0-0-0.coldpress-ddp-training.coldpress-project.svc.cluster.local
              - name: MASTER_PORT
                value: '29500'
              - name: RANK
                value: '0'
              - name: WORLD_SIZE
                value: '2'
              volumeMounts:
              - name: results
                mountPath: /results
                subPath: coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821/task-0
              - name: dshm
                mountPath: /dev/shm
              - name: training-script
                mountPath: /workspace/train.py
                subPath: train.py
            tolerations: &id001
            - operator: Exists
            volumes:
            - name: results
              persistentVolumeClaim:
                claimName: coldpress-project-storage
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
            - name: training-script
