apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: coldpress-ddp-training
  namespace: coldpress-project
  labels:
    app.kubernetes.io/managed-by: coldpress
    app.kubernetes.io/version: 0.2.0
    kueue.x-k8s.io/queue-name: coldpress-local-queue-coldpress-project
    coldpress.io/job-id: coldpress-ddp-training
  annotations:
    coldpress.io/base-dir: coldpress-project/coldpress_results/ddp-training-0006ac7f-20260415_235821
    coldpress.io/storage-pvc: coldpress-project-storage
spec:
