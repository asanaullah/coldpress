apiVersion: batch/v1
kind: Job
metadata:
  name: ddp-training
  namespace: coldpress-project
spec:
  template:
    metadata:
      labels:
        app: ddp-training
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: training
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          workingDir: /workspace
          command: ["bash", "-c"]
          args:
            - |
              # Build torch.distributed.run command from env vars
              CMD="python -m torch.distributed.run"

              # Add distributed params if env vars are set
              [ -n "$NPROC_PER_NODE" ] && CMD="$CMD --nproc_per_node=$NPROC_PER_NODE"
              [ -n "$NNODES" ] && CMD="$CMD --nnodes=$NNODES"
              [ -n "$RANK" ] && CMD="$CMD --node_rank=$RANK"
              [ -n "$MASTER_ADDR" ] && CMD="$CMD --master_addr=$MASTER_ADDR"
              [ -n "$MASTER_PORT" ] && CMD="$CMD --master_port=$MASTER_PORT"

              # Training script and args
              CMD="$CMD train.py"
              CMD="$CMD --dataset=mnist"
              CMD="$CMD --train-test-split=0.8"
              CMD="$CMD --epochs=50"
              CMD="$CMD --batch-size=128"
              CMD="$CMD --hidden-size=4096"
              CMD="$CMD --lr=0.01"
              CMD="$CMD --output-dir=/results/checkpoints"

              echo "Running: $CMD"
              exec $CMD
          resources:
            requests:
              nvidia.com/gpu: "2"
              memory: "16Gi"
              cpu: "8"
            limits:
              nvidia.com/gpu: "2"
              memory: "16Gi"
          env:
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NPROC_PER_NODE
              value: "2"
          volumeMounts:
            - name: results
              mountPath: /results
            - name: dshm
              mountPath: /dev/shm
            - name: training-script
              mountPath: /workspace/train.py
              subPath: train.py
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: coldpress-project-storage
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: training-script
          configMap:
            name: ddp-training-files
