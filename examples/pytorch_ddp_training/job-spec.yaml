# Generated by: Claude Sonnet 4.5
name: ddp-training

tolerate_all: true

containers:
  - name: training
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
    workingDir: /workspace
    command: ["python", "-m", "torch.distributed.run"]
    args:
      - --nproc_per_node=2
      - --nnodes=1
      - train.py
      - --dataset=mnist
      - --train-test-split=0.8
      - --epochs=50
      - --batch-size=128
      - --hidden-size=4096
      - --lr=0.01
      - --output-dir=/results/checkpoints
    resources:
      requests:
        nvidia.com/gpu: "2"
        memory: "16Gi"
        cpu: "8"
      limits:
        nvidia.com/gpu: "2"
        memory: "16Gi"
    env:
      - name: NCCL_DEBUG
        value: "INFO"

volumes:
  - name: results
    mount: /results
  - name: dshm
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    mount: /dev/shm
