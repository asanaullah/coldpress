# Vanilla Kubernetes manifests
# PROBLEM: These Jobs will race - benchmark-client starts immediately
# and fails because inference-server isn't ready yet.
# Coldpress solves this with JobSet dependencies (dependsOn + status: Ready)

---
apiVersion: batch/v1
kind: Job
metadata:
  name: inference-server
  namespace: coldpress-project
spec:
  template:
    metadata:
      labels:
        app: inference-server
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: server
          image: nvcr.io/nvidia/vllm:26.03-py3
          command: ["bash", "-c"]
          args:
            - |
              python -m vllm.entrypoints.openai.api_server \
                --model="${VLLM_MODEL}" \
                --port="${VLLM_PORT}" \
                --max-model-len="${VLLM_MAX_MODEL_LEN}" \
                --gpu-memory-utilization="${VLLM_GPU_MEMORY_UTIL}"
          env:
            - name: HOME
              value: /tmp
            - name: VLLM_MODEL
              value: "ibm-granite/granite-3.3-8b-instruct"
            - name: VLLM_PORT
              value: "8000"
            - name: VLLM_MAX_MODEL_LEN
              value: "10000"
            - name: VLLM_GPU_MEMORY_UTIL
              value: "0.6"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: coldpress-project-storage

---
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-client
  namespace: coldpress-project
spec:
  template:
    metadata:
      labels:
        app: benchmark-client
    spec:
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: client
          image: ghcr.io/vllm-project/guidellm:nightly
          command: ["bash", "-c"]
          args:
            - |
              guidellm benchmark run \
                --target "${GUIDELLM_TARGET}" \
                --output-dir "${GUIDELLM_OUTPUT_DIR}" \
                --outputs "${GUIDELLM_OUTPUTS}" \
                --max-seconds ${GUIDELLM_MAX_SECONDS} \
                --rate-type ${GUIDELLM_RATE_TYPE} \
                --rate ${GUIDELLM_RATE} \
                --data "${GUIDELLM_DATA}"
          env:
            - name: HOME
              value: /tmp
            - name: GUIDELLM_TARGET
              value: "http://localhost:8000"
            - name: GUIDELLM_OUTPUT_DIR
              value: "/results"
            - name: GUIDELLM_OUTPUTS
              value: "json"
            - name: GUIDELLM_MAX_SECONDS
              value: "30"
            - name: GUIDELLM_RATE_TYPE
              value: "throughput"
            - name: GUIDELLM_RATE
              value: "1"
            - name: GUIDELLM_DATA
              value: "prompt_tokens=256,output_tokens=128"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: coldpress-project-storage
