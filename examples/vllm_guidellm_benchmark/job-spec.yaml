# Generated by: Claude Sonnet 4.5
name: inference-server
tolerate_all: true

containers:
  - name: server
    image: nvcr.io/nvidia/vllm:26.03-py3
    command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
    args:
      - --model=ibm-granite/granite-3.3-8b-instruct
      - --port=8000
      - --max-model-len=10000
      - --gpu-memory-utilization=0.6
    env:
      - name: HOME
        value: /tmp
    ports:
      - containerPort: 8000
        name: http
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
    resources:
      requests:
        nvidia.com/gpu: "1"
      limits:
        nvidia.com/gpu: "1"

volumes:
  - name: results
    mount: /results
---
name: benchmark-client
tolerate_all: true

containers:
  - name: client
    image: ghcr.io/vllm-project/guidellm:nightly
    command: ["bash", "-c"]
    args:
      - >-
        guidellm benchmark run
        --target "http://inference-server:8000"
        --output-dir "/results"
        --outputs "json"
        --max-seconds 30
        --rate-type throughput
        --rate 1
        --data "prompt_tokens=256,output_tokens=128"
    env:
      - name: HOME
        value: /tmp

volumes:
  - name: results
    mount: /results
